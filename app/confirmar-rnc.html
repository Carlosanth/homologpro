<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmação de responsabilidade — HomologPro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FAFAFA; --surface: #ffffff; --surface2: #F1F5F9;
    --border: #E2E8F0; --navy: #0A192F; --text: #0F172A; --text-muted: #94A3B8;
    --accent: #0066FF; --accent-bg: #EAF2FF; --tan: #64FFDA;
    --danger: #dc2626; --danger-bg: #fef2f2;
    --success: #16a34a; --success-bg: #f0fdf4;
    --warn: #d97706; --warn-bg: #fffbeb;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding-top: 58px;
  }
  .top-brand {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    height: 58px; background: var(--navy); color: #fff; padding: 0 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .top-brand b { font-size: 14px; font-weight: 700; }
  .top-brand b .tag { color: var(--tan); }
  .top-brand .sub { font-size: 11px; color: rgba(226,232,240,.7); display: block; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .title { font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .doc-box { border: 1px solid #999; border-radius: 2px; padding: 8px 10px; margin-bottom: 16px; background: #fff; }
  .doc-box .nome { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  .doc-box .meta { font-size: 11px; color: #666; margin-top: 4px; display: flex; gap: 16px; }

  .id-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 18px; }
  .id-table th { background: var(--navy); color: #fff; padding: 5px 6px; text-align: left; font-weight: 600; }
  .id-table td { padding: 5px 6px; border: 1px solid var(--border); }

  .secao { margin-bottom: 16px; }
  .secao-titulo { background: #ebeef0; padding: 4px 8px; font-size: 12px; font-weight: 600; color: #1a1a1a; border-radius: 2px; margin-bottom: 8px; }
  .secao-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .campo-check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .check-box { display: inline-block; width: 11px; height: 11px; border: 1px solid #555; flex-shrink: 0; }
  .check-box.on { background: var(--navy); }
  .campo-texto .rotulo { font-size: 10px; color: var(--text-muted); }
  .campo-texto .valor { font-size: 13px; }

  .confirmar-box { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .confirmar-pergunta { font-size: 13.5px; margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { opacity: .92; }
  .btn-primary:disabled { opacity: .5; cursor: default; }

  .estado-ok { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 30px 10px; color: var(--success); }
  .estado-ok .msg { color: var(--text); font-size: 14px; }
  .estado-erro { padding: 30px 10px; text-align: center; color: var(--danger); font-size: 14px; }
  .carregando { padding: 40px 10px; text-align: center; color: var(--text-muted); font-size: 13px; }

  .ja-confirmado { display: flex; align-items: center; gap: 8px; color: var(--success); font-size: 13.5px; font-weight: 600; }
  .foot { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 24px; }
</style>
</head>
<body>

<div class="top-brand">
  <b>Homolog<span class="tag">Pro</span><span class="sub">Confirmação de responsabilidade</span></b>
</div>

<div class="wrap">
  <div class="card">
    <div id="conteudo" class="carregando">Carregando...</div>
  </div>
  <div class="foot" id="foot-copy"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/dist/umd/supabase.js" integrity="sha384-3lSoufGjgosjqp3JDr/NReX3PjMd3SlC8wJ23CWFjB6DSFNf71I0DhcRTUm9MwgO" crossorigin="anonymous"></script>
<script>
// Mesma URL/chave pública já usadas no fornecedor-portal.html — troque aqui
// se algum dia o projeto Supabase mudar.
const SUPABASE_URL = 'https://qmvfsgwzbrhbxyonntgh.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JjiXWFQTcOrUf5RXjsfeVw_5cwLPHf3';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const SUPORTE_CONTATO = 'suporte@homologpro.com.br';
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function renderSecoes(secoes, dados) {
  return secoes.map(sec => {
    let corpo;
    if (sec.tipo === 'campos_diversos') {
      corpo = `<div class="secao-grid">${sec.campos.map(c => {
        const valor = dados[c.id] ?? '—';
        const rotulo = (c.label && c.label.trim()) ? c.label : '';
        return `<div class="campo-texto">${rotulo ? `<div class="rotulo">${escapeHtml(rotulo)}</div>` : ''}<div class="valor">${escapeHtml(String(valor))}</div></div>`;
      }).join('')}</div>`;
    } else {
      corpo = `<div class="secao-grid">${sec.campos.map(c => `
        <label class="campo-check"><span class="check-box ${dados[c.id] ? 'on' : ''}"></span>${escapeHtml(c.label)}</label>
      `).join('')}</div>`;
    }
    return `<div class="secao"><div class="secao-titulo">${escapeHtml(sec.titulo)}</div>${corpo}</div>`;
  }).join('');
}

async function carregar() {
  document.getElementById('foot-copy').textContent = `HomologPro © ${new Date().getFullYear()} • Suporte: ${SUPORTE_CONTATO}`;

  if (!token) {
    document.getElementById('conteudo').innerHTML = '<div class="estado-erro">Link inválido — faltou o token na URL.</div>';
    return;
  }

  const { data, error } = await supabaseClient.functions.invoke('confirmar-rnc-dados', { body: { token } });

  if (error || !data || data.ok === false) {
    document.getElementById('conteudo').innerHTML = `<div class="estado-erro">${(data && data.error) || 'Não foi possível carregar essa confirmação. O link pode estar incorreto.'}</div>`;
    return;
  }

  const wrap = document.getElementById('conteudo');
  wrap.innerHTML = `
    <div class="eyebrow">Confirmação de responsabilidade</div>
    <div class="title">${escapeHtml(data.modeloNome || 'Registro de não conformidade')}</div>
    <div class="sub">Você foi indicado(a) como responsável pelo registro abaixo. Confira o que foi preenchido e confirme que foi você.</div>

    <table class="id-table">
      <tr><th>Nº RNC</th><th>Fornecedor</th><th>Nota fiscal</th><th>Data</th></tr>
      <tr>
        <td>${escapeHtml(data.numeroSequencial || '—')}</td>
        <td>${escapeHtml(data.fornecedorNome || '—')}</td>
        <td>${escapeHtml(data.numeroNf || '—')}</td>
        <td>${data.criadoEm ? new Date(data.criadoEm).toLocaleDateString('pt-BR') : '—'}</td>
      </tr>
    </table>

    ${renderSecoes(data.secoes || [], data.dados || {})}

    <div class="confirmar-box" id="confirmar-box">
      ${data.jaConfirmado
        ? `<div class="ja-confirmado">✓ Você já confirmou este registro em ${new Date(data.confirmadoEm).toLocaleString('pt-BR')}.</div>`
        : `
          <p class="confirmar-pergunta">Ao confirmar, você declara que foi a pessoa responsável pelo que está descrito acima.</p>
          <button class="btn btn-primary" id="btn-confirmar" onclick="confirmar()">Confirmo que fui eu</button>
        `}
    </div>
  `;
}

async function confirmar() {
  const btn = document.getElementById('btn-confirmar');
  btn.disabled = true;
  btn.textContent = 'Confirmando...';

  const { data, error } = await supabaseClient.functions.invoke('confirmar-rnc', { body: { token } });

  if (error || !data || data.ok === false) {
    document.getElementById('confirmar-box').innerHTML = `<div class="estado-erro">${(data && data.error) || 'Não foi possível confirmar agora. Tente novamente em instantes.'}</div>`;
    return;
  }

  document.getElementById('conteudo').innerHTML = `
    <div class="estado-ok">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <div class="msg">Confirmado com sucesso — obrigado!</div>
    </div>
  `;
}

carregar();
</script>
</body>
</html>
